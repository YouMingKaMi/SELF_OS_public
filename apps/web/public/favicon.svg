<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- SELF OS · 圆桌: the table, five seats, and the head seat — yours. -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1d20"/><stop offset=".55" stop-color="#0b0b0c"/><stop offset="1" stop-color="#040404"/></linearGradient>
  <radialGradient id="sheen" cx=".5" cy="0" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".13"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".4" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="silver" gradientUnits="userSpaceOnUse" x1="0" y1="140" x2="0" y2="900"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#d9d9d9"/><stop offset="1" stop-color="#8e8e8e"/></linearGradient>
