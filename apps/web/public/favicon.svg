</defs>
<rect width="1024" height="1024" rx="228" fill="url(#bg)"/><rect width="1024" height="1024" rx="228" fill="url(#sheen)"/><rect x="3" y="3" width="1018" height="1018" rx="225" fill="none" stroke="url(#edge)" stroke-width="6"/>
<g>
